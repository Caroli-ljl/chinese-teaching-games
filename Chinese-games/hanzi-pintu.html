<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>汉字拼图 - 中文学习小游戏</title>
<!-- CloudBase SDK：defer 异步加载，绝不阻塞游戏交互；游戏自身脚本同步绑定，加载即可点击 -->
<script defer src="lib/cloudbase.full.js"></script>
<script src="../content.js?v=4"></script>
<style>
  :root{
    --primary:#6d5dfc; --primary-d:#5a4fe0; --primary-l:#ece9ff;
    --bg:#f5f7fa; --card:#ffffff; --text:#303133; --sub:#909399;
    --border:#e4e7ed; --green:#67c23a; --green-l:#f0f9eb; --red:#f56c6c; --gold:#e6a23c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:linear-gradient(165deg,#fff4ec,#eafaf6,#eef1ff);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans",-apple-system,system-ui,sans-serif;}
  .pinyin{font-family:"Noto Sans","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #app{max-width:640px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}
  .screen{display:none;animation:fade .25s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .brand{font-size:30px;font-weight:800;text-align:center;margin-top:8px;color:var(--primary)}
  .intro{text-align:center;color:var(--sub);margin:6px 0 18px;font-size:15px}
  .diff-row{display:flex;gap:10px;margin:0 0 16px}
  .diff-btn{flex:1;border:2px solid var(--primary);background:var(--card);color:var(--primary);
    border-radius:14px;padding:18px 6px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
  .diff-btn:active{transform:scale(.96)}
  .diff-btn small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:4px}
  .best{background:var(--primary-l);border:1px solid #c6e2ff;border-radius:12px;padding:10px 14px;
    font-size:14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:14px}
  .best b{color:var(--primary-d)}
  .info-card{background:#fffbe6;border:1px solid #ffe58f;border-radius:12px;padding:12px 14px;
    font-size:13px;color:#7a6a00;line-height:1.7;margin-bottom:12px}
  .info-card a{color:var(--primary-d)}
  .tags{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
  .tags span{background:var(--primary-l);color:var(--primary-d);border-radius:20px;padding:4px 12px;font-size:12px}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.green{background:var(--green);color:#fff}
  .btn.btn-ghost{background:#fff;border:2px solid var(--border);color:var(--text)}
  .btn.green.btn-ghost,.btn.green-border{border:2px solid var(--green);color:var(--green);background:#fff}
  h2{font-size:22px;margin:4px 0 4px}
  .sub{color:var(--sub);font-size:14px;margin:0 0 14px}
  .back{background:none;border:none;color:var(--primary);font-size:15px;cursor:pointer;padding:4px 0;margin-bottom:8px}
  textarea,input[type=text],input:not([type]){width:100%;border:1px solid var(--border);border-radius:10px;
    padding:12px;font-size:15px;font-family:inherit;margin-bottom:10px;outline:none}
  textarea:focus,input:focus{border-color:var(--primary)}
  textarea{min-height:90px;resize:vertical}
  .preview{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .pv{background:var(--primary-l);border-radius:10px;padding:8px 10px;font-size:14px}
  .pv b{color:var(--primary-d)}
  .pv.warn{background:#fef0f0;color:var(--red)}
  .lib-list{display:flex;flex-direction:column;gap:10px}
  .lib-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}
  .lib-item:hover{border-color:var(--primary)}
  .lib-item .ln{font-weight:700}
  .lib-item .lm{color:var(--sub);font-size:12px;margin:4px 0}
  .lib-item .lc{color:var(--primary-d);font-size:13px}
  .lib-item .del{float:right;color:var(--red);font-size:12px;background:none;border:none;cursor:pointer}
  .char-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .char-check{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--border);
    border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer}
  .char-check input{accent-color:var(--primary)}
  /* game */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .topbar .back{margin:0}
  .qinfo{font-weight:700;font-size:15px}
  .hint-btn{background:#fff7e6;border:1px solid #ffd591;color:var(--gold);border-radius:10px;
    padding:8px 12px;font-size:13px;cursor:pointer;font-weight:600}
  .progress{height:8px;background:#ebeef5;border-radius:6px;overflow:hidden;margin-bottom:10px}
  #progBar{height:100%;width:0;background:var(--primary);transition:.3s}
  .combo{text-align:center;height:26px;font-size:18px;font-weight:800;color:var(--gold);margin:4px 0}
  .hint-area{text-align:center;background:#fff;border:1px solid var(--border);border-radius:14px;
    padding:14px;margin-bottom:14px}
  .hint-pinyin{font-size:26px;font-weight:800;color:var(--primary)}
  .hint-meaning{color:var(--sub);font-size:14px;margin-top:2px}
  .speak{margin-top:8px;background:var(--primary-l);border:none;color:var(--primary-d);border-radius:20px;
    padding:6px 16px;font-size:14px;cursor:pointer}
  .assembly{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0;min-height:120px}
  .slot{width:92px;height:92px;border:2px dashed var(--border);border-radius:14px;display:flex;
    align-items:center;justify-content:center;font-size:48px;color:var(--text);background:#fafafa;transition:.15s}
  .slot.tb{width:92px;height:92px}
  .assembly.tb{flex-direction:column}
  .slot.hot{border-color:var(--primary);transform:scale(1.06);background:var(--primary-l)}
  .slot.right{border:2px solid var(--green);background:var(--green-l);animation:pulse .4s}
  .slot.wrong{border:2px solid var(--red);background:#fef0f0;animation:shake .4s}
  .plus{font-size:30px;color:var(--sub);font-weight:800}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0 6px}
  .part{border:2px solid var(--primary);background:#fff;color:var(--primary-d);border-radius:14px;
    width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:44px;
    cursor:grab;touch-action:none;user-select:none;transition:.12s}
  .part:active{cursor:grabbing}
  .part.used{opacity:.35;pointer-events:none}
  .part.dragging{opacity:.3}
  .drag-ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);
    border:2px solid #8e7bff;background:#f3efff;color:#5b3fd6;border-radius:14px;width:84px;height:84px;
    display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
  .feedback{text-align:center;min-height:24px;font-size:15px;font-weight:600;margin:10px 0}
  .feedback.ok{color:var(--green)} .feedback.warn{color:var(--gold)} .feedback.err{color:var(--red)}
  .meaning-tag{display:inline-block;background:var(--green-l);border-left:3px solid var(--green);
    color:#387d1f;border-radius:8px;padding:6px 12px;font-size:14px;margin-top:6px}
  .next-btn{display:block;width:100%;margin-top:14px;background:var(--primary);color:#fff;border:none;
    border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
  /* result */
  .result-emoji{font-size:54px;text-align:center;margin:6px 0}
  .badge{display:block;text-align:center;font-size:20px;font-weight:800;margin:6px 0 14px}
  .badge.S{color:#f56c6c}.badge.A{color:var(--primary)}.badge.B{color:var(--gold)}.badge.C{color:var(--sub)}
  .ring{width:140px;height:140px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:30px;font-weight:800;color:var(--primary)}
  .stats{display:flex;justify-content:space-around;background:#fff;border:1px solid var(--border);
    border-radius:12px;padding:12px;margin-bottom:14px}
  .stats div{text-align:center;font-size:13px;color:var(--sub)}
  .stats b{display:block;font-size:20px;color:var(--text);margin-top:2px}
  .review{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .review-item{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);
    border-radius:10px;padding:8px 12px;font-size:15px}
  .review-item.wrong{border-color:#fbc4c4;background:#fff5f5}
  .review-mark{font-weight:800}
  .review-char{font-size:22px;font-weight:800;width:30px}
  .review-pinyin{color:var(--primary);font-weight:600}
  .review-meaning{color:var(--sub);font-size:13px}
  .review-extra{font-size:12px;color:var(--red);margin-left:auto}
  /* overlay / modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;padding:24px;width:88%;max-width:360px;text-align:center}
  .modal h3{margin:0 0 6px;color:var(--primary)}
  .modal p{color:var(--sub);font-size:14px;margin:0 0 14px}
  .modal input{margin-bottom:14px}
  /* floating home */
  #cbHomeBtn{position:fixed;left:14px;bottom:16px;z-index:900;width:44px;height:44px;border-radius:50%;
    background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:20px;text-decoration:none;box-shadow:0 4px 12px rgba(64,158,255,.4)}
  /* leaderboard */
  .lb{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .lb-head{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:8px}
  .status{font-size:12px;color:var(--sub);font-weight:400}
  .lb-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #f2f4f7;font-size:14px}
  .lb-row .medal{width:22px;text-align:center}
  .lb-row .nm{flex:1;font-weight:600}
  .lb-row .sc{color:var(--primary-d);font-weight:700}
  .lb-empty{color:var(--sub);font-size:13px;padding:6px 0}
  /* toast */
  .toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;
    padding:12px 20px;border-radius:10px;font-size:14px;z-index:2000;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  /* flash */
  .flash{position:fixed;inset:0;z-index:1500;pointer-events:none;opacity:0}
  .flash.green{background:#67c23a;animation:flgreen .25s}
  .flash.red{background:#f56c6c;animation:flred .35s}
  @keyframes flgreen{0%{opacity:.5}100%{opacity:0}}
  @keyframes flred{0%{opacity:.5}100%{opacity:0}}
  .shake-screen{animation:scrShake .35s}
  @keyframes scrShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}
  /* 常驻顶栏：返回上一级 + 结束（全站小游戏统一） */
  .gtb{position:sticky;top:0;z-index:40;align-self:stretch;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid rgba(15,23,42,.08);box-shadow:0 2px 10px rgba(15,23,42,.06);box-sizing:border-box}
  .gtb-btn{height:38px;padding:0 16px;border-radius:999px;border:1px solid transparent;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;line-height:1;white-space:nowrap}
  .gtb-back{background:#f1f0ff;color:#6d5dfc;border-color:#e3e0ff}
  .gtb-back:hover{background:#e8e6ff}
  .gtb-end{background:#fff0f0;color:#e5484d;border-color:#ffd9d9}
  .gtb-end:hover{background:#ffe6e6}
</style>
<script src="../config.js"></script>
</head>
<body>
<div class="gtb"><button class="gtb-btn gtb-back" onclick="gtbBack()">← 返回上一级</button><button class="gtb-btn gtb-end" onclick="gtbEnd()">⏹ 结束</button></div>
<div id="app">
  <!-- START -->
  <section id="start" class="screen active">
    <div style="display:flex;justify-content:flex-start">
      <button class="back" onclick="goWorks()">← 返回列表</button>
    </div>
    <div class="brand">✨ 汉字拼图</div>
    <p class="intro">把汉字拆成小零件，拖一拖拼回去——边玩边记住汉字怎么写！</p>
    <div class="diff-row">
      <button class="diff-btn" onclick="startGame('easy')">入门<small>8 题 · 左右结构</small></button>
      <button class="diff-btn" onclick="startGame('normal')">进阶<small>12 题 · 更多偏旁</small></button>
      <button class="diff-btn" onclick="startGame('hard')">挑战<small>16 题 · 混合结构</small></button>
    </div>
    <div class="best" id="bestBox"></div>
    <div class="lb">
      <div class="lb-head"><span>☁️ 云端实时排行</span><span class="status" id="lbStatus">连接中…</span></div>
      <div id="liveboard"><div class="lb-empty">加载中…</div></div>
    </div>
    <div class="info-card">
      教学信息：面向非华语学习者，通过拖拽汉字部件拼合完整汉字，建立字形结构认知。<br>
      部件拆解数据来源：<a href="https://ichara.cn" target="_blank" rel="noopener">ichara.cn 云里造字</a>（构件系统）。
    </div>
    <div class="tags"><span>字形认知</span><span>部件拆分</span><span>结构理解</span></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="show('teacher')">📝 老师自定义题库</button>
      <button class="btn green-border" onclick="show('library')">📚 我的词库</button>
    </div>
    <p class="sub" style="margin-top:10px">💡 想用自己的生词练习？点「我的词库」保存；「老师自定义题库」是老师准备的内容。</p>
  </section>

  <!-- TEACHER -->
  <section id="teacher" class="screen">
    <button class="back" onclick="show('start');renderLibraries()">← 返回</button>
    <h2>📝 老师自定义题库</h2>
    <p class="sub">输入要练习的汉字，系统自动拆解部件</p>
    <textarea id="teacherInput" placeholder="请输入要拆解的汉字（最多 50 个）…" oninput="onTeacherInput()"></textarea>
    <div class="preview" id="teacherPreview"></div>
    <input id="libName" type="text" placeholder="词库名称（如：第三课生词），留空自动生成" />
    <div class="actions">
      <button class="btn green" onclick="saveLibrary()">💾 保存词库</button>
      <button class="btn primary" id="genBtn" onclick="generateFromInput()">🚀 生成游戏</button>
    </div>
  </section>

  <!-- LIBRARY -->
  <section id="library" class="screen">
    <button class="back" onclick="show('start')">← 返回</button>
    <h2>📚 自定义词库</h2>
    <p class="sub">选择已保存的词库开始练习</p>
    <div class="lib-list" id="libList"></div>
    <div class="lib-practice" id="libPractice" style="display:none">
      <h3 style="margin:14px 0 6px">📋 选择练习汉字</h3>
      <div class="actions" style="margin-bottom:8px">
        <button class="btn btn-ghost" onclick="selectAllLib(true)">全选</button>
        <button class="btn btn-ghost" onclick="selectAllLib(false)">全不选</button>
      </div>
      <div class="char-grid" id="libCharGrid"></div>
      <label style="font-size:14px">练习题数
        <input id="libCount" type="number" min="1" style="width:90px;display:inline-block;margin-left:8px" />
      </label>
      <div class="actions" style="margin-top:12px">
        <button class="btn btn-ghost" onclick="show('library');renderLibraries()">← 返回</button>
        <button class="btn primary" onclick="startLibPractice()">🚀 开始练习</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="topbar">
      <button class="back" onclick="quitGame()">← 返回</button>
      <div class="qinfo"><span id="qNum">1/8</span> · <span id="score">0</span> 分</div>
      <button class="hint-btn" id="hintBtn" onclick="useHint()">💡 提示 -20</button>
    </div>
    <div class="progress"><div id="progBar"></div></div>
    <div class="combo" id="combo"></div>
    <div class="hint-area">
      <div class="hint-pinyin pinyin" id="hintPinyin"></div>
      <div class="hint-meaning" id="hintMeaning"></div>
      <button class="speak" onclick="speakTarget()">🔊 朗读</button>
    </div>
    <div class="assembly" id="assembly"></div>
    <div class="pool" id="pool"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" style="display:none" onclick="nextQuestion()">下一题 →</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="result-emoji" id="rEmoji">🎉</div>
    <h2 id="rTitle" style="text-align:center">太棒了！</h2>
    <div class="badge" id="rBadge"></div>
    <div class="ring" id="rRing">100%</div>
    <div class="stats" id="rStats"></div>
    <div class="review" id="rReview"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="goBack()">返回列表</button>
      <button class="btn primary" onclick="replay()">再来一次</button>
      <button class="btn green" onclick="exportReview()">📤 导出复习单</button>
    </div>
  </section>
</div>

<!-- nickname gate -->
<div class="overlay" id="nameOverlay">
  <div class="modal">
    <h3>先告诉我你的名字 👋</h3>
    <p>用于记录成绩到云端实时擂台</p>
    <input id="nameInput" type="text" maxlength="12" placeholder="输入昵称" />
    <button class="btn primary" id="nameConfirm" style="width:100%">开始游戏</button>
  </div>
</div>
<a id="cbHomeBtn" href="javascript:void(0)" onclick="goBack()">←</a>

//==================== question building ====================//
function randPool(){
  var set={};
  Object.keys(CHAIZI).forEach(function(k){ CHAIZI[k].p.forEach(function(p){ set[p]=1; }); });
  return Object.keys(set);
}
function makeDistractors(parts, sourceChars){
  var pool=randPool().filter(function(p){ return parts.indexOf(p)<0; });
  var res=[]; var ckey=parts.slice().sort().join('|');
  // shuffle pool
  pool.sort(function(){return Math.random()-0.5;});
  for(var i=0;i<pool.length && res.length<2;i++){
    var cand=pool[i];
    var test=parts.concat([cand]).sort().join('|');
    // unique-solution safety: candidate + any correct part must not form another char
    var safe=true;
    parts.forEach(function(p){
      var k=[p,cand].sort().join('|');
      if(PART_PAIR_MAP[k] && k!==ckey) safe=false;
    });
    if(safe) res.push(cand);
  }
  // fallback if not enough
  var j=0;
  while(res.length<2 && j<pool.length){ if(res.indexOf(pool[j])<0) res.push(pool[j]); j++; }
  return res.slice(0,2);
}
function buildQuestions(chars){
  var qs=[];
  chars.forEach(function(ch){
    var d=CHAIZI[ch];
    if(!d) return;
    var parts=d.p.slice();
    var distractors=makeDistractors(parts, ch);
    qs.push({ char:ch, parts:parts, st:d.s, py:PINYIN[ch]||'', mn:MEANING[ch]||'', distractors:distractors });
  });
  return qs;
}

//==================== game flow ====================//
function startGame(diff){
  if(!getNick()){ openNameGate(function(){ startGame(diff); }); return; }
  G.mode='diff'; G.difficulty=diff;
  var chars=(DEFAULT_LIB[diff]||[]).slice();
  G.questions=shuffle(buildQuestions(chars)).slice(0, DIFF[diff].n);
  if(G.questions.length===0){ showToast('题库为空'); return; }
  G.idx=0; G.score=0; G.combo=0; G.maxCombo=0; G.correct=0; G.wrong=0;
  show('game'); renderQuestion();
}
function startLibPractice(){
  if(!getNick()){ openNameGate(startLibPractice); return; }
  var sel=collectLibSel();
  if(sel.length===0){ showToast('请至少选择一个汉字'); return; }
  var n=parseInt($('libCount').value,10)||sel.length; n=Math.min(n,sel.length);
  var picked=shuffle(sel.slice()).slice(0,n);
  G.mode='lib'; G.questions=buildQuestions(picked);
  G.idx=0; G.score=0; G.combo=0; G.maxCombo=0; G.correct=0; G.wrong=0;
  show('game'); renderQuestion();
}
function replay(){
  if(G.mode==='lib'){ startLibPractice(); }
  else { startGame(G.difficulty); }
}
function quitGame(){ clearTimer(); if(G._t) clearInterval(G._t); goBack(); }
function clearTimer(){}

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function renderQuestion(){
  G.attempts=0; G.hintUsed=false; G.current=G.questions[G.idx];
  var q=G.current;
  $('qNum').textContent=(G.idx+1)+'/'+G.questions.length;
  $('score').textContent=G.score;
  $('progBar').style.width=((G.idx)/G.questions.length*100)+'%';
  $('combo').textContent='';
  $('feedback').textContent=''; $('feedback').className='feedback';
  $('nextBtn').style.display='none';
  $('hintBtn').style.display='inline-block'; $('hintBtn').disabled=false;
  $('hintPinyin').textContent=pf(q.py);
  $('hintMeaning').textContent=q.mn?('释义：'+q.mn):'';
  // assembly slots
  var asm=$('assembly'); asm.className='assembly'+(q.st==='tb'?' tb':'');
  asm.innerHTML='';
  var s1=document.createElement('div'); s1.className='slot'; s1.dataset.index='0';
  var plus=document.createElement('div'); plus.className='plus'; plus.textContent='+';
  var s2=document.createElement('div'); s2.className='slot'; s2.dataset.index='1';
  s1.addEventListener('pointerdown', function(e){ slotPointerDown(e, s1); });
  s2.addEventListener('pointerdown', function(e){ slotPointerDown(e, s2); });
  if(q.st==='tb'){ asm.appendChild(s1); asm.appendChild(s2); }
  else { asm.appendChild(s1); asm.appendChild(plus); asm.appendChild(s2); }
  // pool: correct parts + distractors, shuffled
  var pieces=q.parts.concat(q.distractors);
  pieces=shuffle(pieces);
  var pool=$('pool'); pool.innerHTML='';
  pieces.forEach(function(p){
    var el=document.createElement('div'); el.className='part'; el.textContent=p; el.dataset.part=p;
    el.addEventListener('pointerdown', function(e){ startDrag(e, el, p, 'pool'); });
    pool.appendChild(el);
  });
  G._filled=[null,null];
}

var drag=null;
function startDrag(e, el, part, from){
  e.preventDefault();
  var ghost=document.createElement('div'); ghost.className='drag-ghost'; ghost.textContent=part;
  document.body.appendChild(ghost);
  drag={el:el, part:part, from:from, ghost:ghost};
  el.classList.add('dragging');
  moveGhost(e);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}
function moveGhost(e){ drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px'; }
function slotAt(e){
  var slots=document.querySelectorAll('.slot'); var hit=null;
  slots.forEach(function(s){ var r=s.getBoundingClientRect();
    if(e.clientX>=r.left-15&&e.clientX<=r.right+15&&e.clientY>=r.top-15&&e.clientY<=r.bottom+15) hit=s; });
  return hit;
}
function onMove(e){
  moveGhost(e);
  document.querySelectorAll('.slot').forEach(function(s){ s.classList.remove('hot'); });
  var t=slotAt(e); if(t&&!t.dataset.filled) t.classList.add('hot');
}
function onUp(e){
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
  var t=slotAt(e);
  document.querySelectorAll('.slot').forEach(function(s){ s.classList.remove('hot'); });
  if(drag.ghost) drag.ghost.remove();
  if(drag.el) drag.el.classList.remove('dragging');
  if(t && !t.dataset.filled){
    fillSlot(t, drag.part, drag.el, drag.from);
  } else if(drag.from==='slot'){
    returnToPool(drag.part, drag.el);
  }
  drag=null;
  checkFilled();
}
function fillSlot(slot, part, srcEl, from){
  slot.dataset.filled='1'; slot.dataset.part=part; slot.textContent=part;
  var idx=parseInt(slot.dataset.index,10);
  if(from==='pool' && srcEl){ srcEl.classList.add('used'); }
  if(from==='slot' && srcEl){
    // returning a previously-filled slot's card to pool
    srcEl.classList.remove('used');
  }
  G._filled[idx]=part;
}
function clearSlot(slot){
  var idx=parseInt(slot.dataset.index,10);
  var part=slot.dataset.part;
  slot.dataset.filled=''; slot.dataset.part=''; slot.textContent='';
  slot.classList.remove('right','wrong');
  G._filled[idx]=null;
  // restore a pool card with this part
  var cards=document.querySelectorAll('.part');
  var exists=false; cards.forEach(function(c){ if(c.textContent===part && !c.classList.contains('used')) exists=true; });
  if(!exists){
    var el=document.createElement('div'); el.className='part'; el.textContent=part; el.dataset.part=part;
    el.addEventListener('pointerdown', function(e){ startDrag(e, el, part, 'pool'); });
    $('pool').appendChild(el);
  }
}
function returnToPool(part, srcEl){
  if(srcEl) srcEl.classList.remove('used');
}
function slotPointerDown(e, slot){
  if(!slot.dataset.filled) return;
  e.preventDefault();
  var part=slot.dataset.part;
  clearSlot(slot);
  var card=null;
  document.querySelectorAll('.part').forEach(function(c){ if(!card && c.textContent===part && !c.classList.contains('used')) card=c; });
  if(card) startDrag(e, card, part, 'pool');
}
function checkFilled(){
  var slots=document.querySelectorAll('.slot');
  if(slots.length>0 && [].every.call(slots, function(s){ return s.dataset.filled; })) validate();
}
function validate(){
  var q=G.current;
  var slots=[].slice.call(document.querySelectorAll('.slot'));
  var allRight=true, wrongCount=0;
  slots.forEach(function(s,i){
    s.classList.remove('right','wrong');
    if(s.dataset.part===q.parts[i]){ s.classList.add('right'); }
    else { s.classList.add('wrong'); allRight=false; wrongCount++; }
  });
  if(allRight){ onCorrect(); return; }
  G.attempts++;
  if(G.attempts===1){
    G.score-=10; updateScore();
    showFeedback('warn','有 '+wrongCount+' 个部件位置不对，再试试！-10 分');
    setTimeout(function(){
      document.querySelectorAll('.slot.wrong').forEach(function(s){ clearSlot(s); });
      G.attempts=0;
    },1200);
  } else {
    G.score-=30; updateScore();
    onReveal();
  }
}
function onCorrect(){
  G.correct++; G.combo++; if(G.combo>G.maxCombo) G.maxCombo=G.combo;
  G.current._ok=true;
  var bonus=Math.min((G.combo-1)*20,140);
  G.score+=100+bonus; updateScore();
  flash('green');
  if(G.combo>=3){ confetti(); if(navigator.vibrate) navigator.vibrate(30); }
  var q=G.current;
  var msg='✅ 正确！+ '+(100+bonus)+' 分';
  if(G.combo>=3) msg+='  '+comboText(G.combo);
  showFeedback('ok', msg);
  if(q.mn) showFeedback('ok', msg+'　📖 '+q.char+'：'+q.mn);
  setTimeout(function(){ speak(q.char); },500);
  $('hintBtn').style.display='none';
  $('nextBtn').style.display='block';
  if(G.idx>=G.questions.length-1) $('nextBtn').textContent='查看结果 →';
}
function onReveal(){
  flash('red'); if(document.body) document.body.classList.add('shake-screen');
  setTimeout(function(){ if(document.body) document.body.classList.remove('shake-screen'); },350);
  var q=G.current;
  // fill correct answer
  var slots=[].slice.call(document.querySelectorAll('.slot'));
  slots.forEach(function(s,i){ s.dataset.filled='1'; s.dataset.part=q.parts[i]; s.textContent=q.parts[i]; s.classList.add('right'); });
  showFeedback('err','❌ 答案：'+q.char+' = '+q.parts.join(' + ')+(q.mn?('（'+q.mn+'）'):''));
  G.current._ok=false; G.wrong++;
  $('hintBtn').style.display='none';
  $('nextBtn').style.display='block';
  if(G.idx>=G.questions.length-1) $('nextBtn').textContent='查看结果 →';
}
function comboText(n){ if(n>=8) return '🔥🔥🔥 八连击！无敌！'; if(n>=5) return '🔥🔥 五连击！超神！'; if(n>=3) return '🔥 三连击！很棒！'; return ''; }
function updateScore(){ $('score').textContent=G.score; }
function showFeedback(cls, msg){ var f=$('feedback'); f.className='feedback '+cls; f.textContent=msg; }
function flash(color){ var f=document.createElement('div'); f.className='flash '+color; document.body.appendChild(f); setTimeout(function(){ f.remove(); },400); }
function useHint(){
  if(G.hintUsed) return;
  var q=G.current;
  // fill first empty correct slot
  var slots=[].slice.call(document.querySelectorAll('.slot'));
  for(var i=0;i<slots.length;i++){
    if(!slots[i].dataset.filled){
      // find a pool card with the correct part
      var cards=[].slice.call(document.querySelectorAll('.part'));
      var card=null;
      cards.forEach(function(c){ if(!card && c.textContent===q.parts[i] && !c.classList.contains('used')) card=c; });
      if(card){ fillSlot(slots[i], q.parts[i], card, 'pool'); }
      break;
    }
  }
  G.hintUsed=true; G.score-=20; updateScore();
  $('hintBtn').disabled=true;
  showFeedback('warn','💡 已填入一个部件 -20 分');
}
function nextQuestion(){
  G.idx++;
  if(G.idx>=G.questions.length){ showResult(); return; }
  $('progBar').style.width=((G.idx)/G.questions.length*100)+'%';
  renderQuestion();
}

//==================== result ====================//
function showResult(){
  clearTimer();
  var total=G.questions.length;
  var rate=total? Math.round(G.correct/total*100):0;
  var grade='C'; var emoji='💪'; var title='加油练习';
  if(rate>=90){ grade='S'; emoji='🏆'; title='太棒了！'; }
  else if(rate>=70){ grade='A'; emoji='🌟'; title='不错哦！'; }
  else if(rate>=50){ grade='B'; emoji='😊'; title='继续进步'; }
  $('rEmoji').textContent=emoji;
  $('rTitle').textContent=title;
  var badge=$('rBadge'); badge.className='badge '+grade; badge.textContent=grade+' 级 · '+(grade==='S'?'拼字大师':grade==='A'?'拼字达人':grade==='B'?'继续进步':'加油练习');
  var ring=$('rRing'); ring.textContent=rate+'%'; ring.style.background='conic-gradient(var(--primary) '+rate+'%, #ebeef5 0)';
  $('rStats').innerHTML='<div>答对<b>'+G.correct+'</b></div><div>答错<b>'+G.wrong+'</b></div><div>最长连对<b>'+G.maxCombo+'</b></div><div>总分<b>'+G.score+'</b></div>';
  // review
  var rev='';
  G.questions.forEach(function(q,i){
    var ok=q._ok;
    var cls=ok?'':' wrong'; var mark=ok?'✅':'❌';
    var extra='';
    if(!ok) extra='<span class="review-extra">应：'+q.char+' = '+q.parts.join('+')+'</span>';
    rev+='<div class="review-item'+cls+'"><span class="review-mark">'+mark+'</span><span class="review-char">'+q.char+'</span><span class="review-pinyin pinyin">'+pf(q.py)+'</span><span class="review-meaning">'+(q.mn||'')+'</span>'+extra+'</div>';
  });
  $('rReview').innerHTML=rev;
  if(rate>=70) confetti();
  // save best + cloud
  saveBest(); saveScoreCloud();
  show('result');
}
function exportReview(){
  var total=G.questions.length, rate=total?Math.round(G.correct/total*100):0;
  var d=new Date();
  var rows=G.questions.map(function(q,i){ return '<tr><td>'+(i+1)+'</td><td style="font-size:22px">'+q.char+'</td><td>'+pf(q.py)+'</td><td>'+(q.mn||'')+'</td><td>'+q.parts.join(' + ')+'</td><td>'+(q._ok?'✅':'❌')+'</td></tr>'; }).join('');
  var html='<html><head><meta charset="UTF-8"><title>汉字拼图复习单</title><style>body{font-family:sans-serif;padding:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px;text-align:center}.wrong{color:#f56c6c}</style></head><body><h2>汉字拼图复习单</h2><p>日期：'+d.toLocaleString()+'　难度：'+DIFF[G.difficulty].name+'</p><p>正确率：'+rate+'%　答对：'+G.correct+'　答错：'+G.wrong+'　总分：'+G.score+'</p><table><tr><th>序号</th><th>汉字</th><th>拼音</th><th>释义</th><th>正确拆分</th><th>作答</th></tr>'+rows+'</table><script>window.onload=function(){window.print();}<\/script></body></html>';
  var w=window.open('','_blank'); w.document.write(html); w.document.close();
}

//==================== best score (local) ====================//
function bestKey(d){ return 'hzpt_best_'+d; }
function updateBest(){
  var html='';
  ['easy','normal','hard'].forEach(function(d){
    var v=localStorage.getItem(bestKey(d))||0;
    html+='<span>'+DIFF[d].name+'最高分：<b>'+v+'</b></span>';
  });
  $('bestBox').innerHTML=html;
}
function saveBest(){
  var k=bestKey(G.difficulty); var prev=parseInt(localStorage.getItem(k)||'0',10);
  if(G.score>prev) localStorage.setItem(k, G.score);
}

//==================== teacher custom ====================//
function onTeacherInput(){
  var v=($('teacherInput').value||'').replace(/\s/g,'').slice(0,50);
  var prev=$('teacherPreview'); prev.innerHTML='';
  var valid=0;
  for(var i=0;i<v.length;i++){
    var ch=v[i]; var d=CHAIZI[ch];
    if(d){ valid++; var t=document.createElement('div'); t.className='pv'; t.innerHTML=ch+' → <b>'+d.p.join('+')+'</b> <span>'+ (d.s==='tb'?'上下':'左右') +'</span>'; prev.appendChild(t); }
    else { var w=document.createElement('div'); w.className='pv warn'; w.textContent=ch+' ⚠ 暂无拆解'; prev.appendChild(w); }
  }
  $('genBtn').disabled = valid===0;
}
function saveLibrary(){
  var v=($('teacherInput').value||'').replace(/\s/g,'').slice(0,50);
  var chars=[]; for(var i=0;i<v.length;i++){ if(CHAIZI[v[i]]) chars.push(v[i]); }
  if(chars.length===0){ showToast('没有可拆解的汉字'); return; }
  var name=($('libName').value||'').trim();
  if(!name) name='词库 '+new Date().toLocaleDateString();
  var libs=JSON.parse(localStorage.getItem(LIB_KEY)||'[]');
  libs.push({ id:Date.now(), name:name, chars:chars, date:new Date().toISOString(), count:chars.length });
  localStorage.setItem(LIB_KEY, JSON.stringify(libs));
  showToast('词库已保存：'+name);
  $('teacherInput').value=''; $('libName').value=''; $('teacherPreview').innerHTML='';
}
function generateFromInput(){
  var v=($('teacherInput').value||'').replace(/\s/g,'').slice(0,50);
  var chars=[]; for(var i=0;i<v.length;i++){ if(CHAIZI[v[i]]) chars.push(v[i]); }
  if(chars.length===0){ showToast('没有可拆解的汉字'); return; }
  if(!getNick()){ openNameGate(generateFromInput); return; }
  G.mode='custom'; G.questions=buildQuestions(chars);
  G.idx=0; G.score=0; G.combo=0; G.maxCombo=0; G.correct=0; G.wrong=0;
  show('game'); renderQuestion();
}

//==================== custom library ====================//
function renderLibraries(){
  var libs=JSON.parse(localStorage.getItem(LIB_KEY)||'[]');
  var box=$('libList'); box.innerHTML='';
  $('libPractice').style.display='none';
  if(libs.length===0){ box.innerHTML='<div class="lb-empty">还没有保存的词库，去「老师自定义题库」创建并保存词库吧</div>'; return; }
  libs.forEach(function(l){
    var item=document.createElement('div'); item.className='lib-item';
    item.innerHTML='<button class="del" onclick="deleteLib('+l.id+',event)">删除</button><div class="ln">'+l.name+'</div><div class="lm">'+new Date(l.date).toLocaleString()+'</div><div class="lc">'+l.chars.join(' ')+'　可练习 '+l.count+' 字</div>';
    item.addEventListener('click', function(e){ if(e.target.classList.contains('del')) return; openLib(l); });
    box.appendChild(item);
  });
}
function deleteLib(id,e){
  e.stopPropagation();
  var libs=JSON.parse(localStorage.getItem(LIB_KEY)||'[]').filter(function(l){ return l.id!==id; });
  localStorage.setItem(LIB_KEY, JSON.stringify(libs));
  renderLibraries(); showToast('已删除词库');
}
function openLib(l){
  window._libSel=l.chars.slice();
  var grid=$('libCharGrid'); grid.innerHTML='';
  l.chars.forEach(function(ch,i){
    var py=PINYIN[ch]||'';
    var lab=document.createElement('label'); lab.className='char-check checked';
    lab.innerHTML='<input type="checkbox" checked onchange="onLibCheck(this)"><span class="review-char">'+ch+'</span><span class="review-pinyin pinyin">'+pf(py)+'</span>';
    grid.appendChild(lab);
  });
  $('libCount').value=l.chars.length; $('libCount').max=l.chars.length;
  $('libList').style.display='none'; $('libPractice').style.display='block';
}
function onLibCheck(cb){ /* selection tracked via DOM */ }
function selectAllLib(v){
  document.querySelectorAll('#libCharGrid input').forEach(function(c){ c.checked=v; });
}
function collectLibSel(){
  var sel=[]; document.querySelectorAll('#libCharGrid .char-check').forEach(function(lab){
    var cb=lab.querySelector('input'); if(cb.checked) sel.push(lab.querySelector('.review-char').textContent);
  }); return sel;
}

//==================== confetti ====================//
function confetti(){
  try{
    var colors=['#409EFF','#67c23a','#e6a23c','#f56c6c','#9254de'];
    for(var i=0;i<28;i++){
      var c=document.createElement('div');
      c.style.cssText='position:fixed;z-index:1600;width:8px;height:12px;background:'+colors[i%colors.length]+';left:'+(Math.random()*100)+'vw;top:-20px;opacity:.9;pointer-events:none;border-radius:2px';
      document.body.appendChild(c);
      var dv=(Math.random()*40+40); var dx=(Math.random()*200-100);
      c.animate([{transform:'translate(0,0) rotate(0)'},{transform:'translate('+dx+'px,'+dv+'vh) rotate('+(Math.random()*720)+'deg)'}],{duration:1400+Math.random()*600,easing:'ease-in'}).onfinish=function(){ c.remove(); };
    }
  }catch(e){}
}

//==================== cloud layer ====================//
var ENV_ID=window.ENV_ID || '__ENV_ID__';
var ACCESS_KEY=window.ACCESS_KEY || '__ACCESS_KEY__';
window.GAME_TYPE='hanzi_pintu';
var _tcb=null,_db=null,_cloudReady=false;
function initCloud(){
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    if(typeof window.cloudbase==='undefined'){ if(tries>40){ clearInterval(iv); _cloudFail('sdk'); } return; }
    clearInterval(iv);
    try{
      var app=window.cloudbase.init({ env:ENV_ID, accessKey:ACCESS_KEY });
      app.auth().signInAnonymously().then(function(){
        _tcb=app; _db=app.database(); _cloudReady=true;
        $('lbStatus').textContent='已连接';
        refreshLeaderboard();
        setInterval(refreshLeaderboard,8000);
        _connectWatch();
      }).catch(function(e){ _cloudFail(e); });
    }catch(e){ _cloudFail(e); }
  },150);
}
function _connectWatch(){
  if(!_db) return;
  try{
    _db.collection('scores').where({ game_type:window.GAME_TYPE }).watch({
      onChange:function(){ refreshLeaderboard(); }
    });
  }catch(e){}
}
function _cloudFail(e){ _cloudReady=false; $('lbStatus').textContent='离线（仅本地）'; }
function saveScoreCloud(){
  if(!_cloudReady||!_db) return;
  try{
    _db.collection('scores').add({
      game_type:window.GAME_TYPE,
      player:getNick()||'匿名学员',
      mode:G.mode,
      score:G.score,
      correct:G.correct,
      wrong:G.wrong,
      total:G.questions.length,
      difficulty:G.difficulty,
      created_at:new Date().toISOString()
    }).then(function(){ refreshLeaderboard(); }).catch(function(){});
  }catch(e){}
}
function refreshLeaderboard(){
  if(!_db) return;
  _db.collection('scores').where({ game_type:window.GAME_TYPE })
    .orderBy('score','desc').limit(20).get().then(function(res){
      var rows=(res.data||[]).filter(function(r){ return r.mode!=='import'; });
      renderLeaderboard(rows.slice(0,3));
    }).catch(function(){});
}
function renderLeaderboard(rows){
  var box=$('liveboard');
  if(!rows||rows.length===0){ box.innerHTML='<div class="lb-empty">还没有成绩，快来抢第一！</div>'; return; }
  var medals=['🥇','🥈','🥉'];
  box.innerHTML=rows.map(function(r,i){
    return '<div class="lb-row"><span class="medal">'+(medals[i]||'')+'</span><span class="nm">'+escapeHtml(r.player||'学员')+'</span><span class="sc">'+r.score+'</span></div>';
  }).join('');
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

//==================== init ====================//
initCloud();
updateBest();
